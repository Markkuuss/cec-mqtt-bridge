[mqtt]
; MQTT broker configuration
; Hostname of mqtt broker (default=localhost)
; broker=localhost

; Port to connect to (default=1883)
; port=1883

; Use TLS (default=0)
; tls=0

; Username and password
; user=
; password=

; MQTT prefix to use (default=cec-mqtt)
; prefix=cec-mqtt

; Name of your device (default=CEC Bridge)
; name=cec-mqtt-bridge

[cec]
; HDMI-CEC configuration
; ID of CEC controller
; id=1

; Port where the CEC device is connected (use `cec-client -l` to list)
; if using kms in /boot/config.txt
; port=/dev/cec0
; port=/dev/cec1
; if using fkms in /boot/config.txt
; port=RPI

; Devices to query (comma separated, defaults to all devices)
; devices=0,2,3,4,5

; Name of your device (default=CEC Bridge)
; name=CEC Bridge

; device power state refresh time in seconds (default=30) (min 10) (0 disables refresh)
; refresh=30

; CEC key press duration in milliseconds (default=200) (0 disables key release)
; keypress_duration_ms=200

; Minimum gap between key presses in milliseconds (default=0)
; keypress_gap_ms=0

